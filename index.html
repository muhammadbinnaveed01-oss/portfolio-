          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + (decoded[0] ? '/' + decoded[0].slice(1) : '') +
            (decoded[1] ? '?' + decoded[1].slice(1) : '') +
            l.hash

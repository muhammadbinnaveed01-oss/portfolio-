<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Contact Us | 3D Experience</title>
  <!-- Google Fonts for modern typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS for rapid styling but custom overrides for precise color percentages -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js & React Three Fiber dependencies via CDN (UMD) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.128.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.92.7"
      }
    }
  </script>
  <style>
    /* enforce exact color proportion: 
       60% black background (global main wrapper), 
       10% purple elements (accents, button, highlights), 
       30% white (form card, text background) 
       Using CSS custom properties and precise layout ratios.
    */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    /* main container: 60% black dominance */
    .sixty-black {
      background-color: #0a0a0a; /* deep black with slight richness */
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* purple accent band / component representation: 10% visual impact 
       we use a glowing gradient overlay and purple button/borders */
    .purple-ten {
      /* purple used in key interactive zones: buttons, focus rings, decorative line */
    }
    /* white card area: contains form content, roughly 30% of the visual weight */
    .white-thirty-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(0px);
      border-radius: 2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(156, 67, 207, 0.2);
      transition: transform 0.2s ease;
    }
    /* purple accents for inputs, buttons, headings */
    .purple-accent {
      color: #9b4dff;
      border-color: #9b4dff;
    }
    .purple-bg {
      background: #9b4dff;
    }
    .purple-bg:hover {
      background: #7c3aed;
    }
    .purple-ring:focus {
      ring-color: #9b4dff;
    }
    /* custom scroll */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #9b4dff;
      border-radius: 10px;
    }
    /* responsive adjustments */
    @media (max-width: 640px) {
      .white-thirty-card {
        margin: 1rem;
        padding: 1.5rem !important;
      }
      .canvas-container {
        height: 280px !important;
      }
    }
    /* canvas wrapper blends with black background */
    .canvas-wrapper {
      background: transparent;
    }
    input, textarea {
      transition: all 0.2s;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useRef, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, useGLTF, Environment, Html, Text } from '@react-three/drei';
    import * as THREE from 'three';

    // -------- Custom GLB Model Loader (with fallback if model fails, but we'll use actual old_gmail_logo.glb) 
    // NOTE: The asset path "/old_gmail_logo.glb" must be present in public folder.
    // For demo purposes: if the GLB fails to load, we'll display an elegant 3D envelope / Gmail inspired shape.
    // But to respect original code, we try to load exactly that model. However, to prevent empty scene 
    // we also provide a fallback using a 3D composed email icon. But since the requirement is to include 
    // the model exactly as in prompt, we use useGLTF with error handling and a placeholder cube with logo texture?
    // For robust demonstration, I'll create a glowing email-like geometric shape + optional glb if available.
    // But given the original code uses "/old_gmail_logo.glb", we will try to load it. If absent, we show a 
    // stylized 3D envelope built with toruses and a cylinder to keep 3D presence.
    
    function ModelWithFallback() {
      const [error, setError] = useState(false);
      let scene = null;
      try {
        // We'll attempt to load but handle gracefully using suspense? Better: use useGLTF with error boundary.
        // UseGLTF hook handles errors via onError but we need a fallback component.
        const { scene: loadedScene } = useGLTF('/old_gmail_logo.glb', undefined, (error) => {
          console.warn("GLB not found or failed to load, using fallback 3D icon", error);
          setError(true);
        });
        if (loadedScene && !error) {
          scene = loadedScene;
        }
      } catch (e) {
        console.warn(e);
        setError(true);
      }
      
      // If error or scene not defined after hook, we render a custom 3D mail icon.
      if (error || !scene) {
        return (
          <group position={[0, -0.2, 0]} scale={1.2}>
            {/* Envelope base: a rounded box */}
            <mesh position={[0, 0, 0]} castShadow receiveShadow>
              <boxGeometry args={[1.6, 1.1, 0.4]} />
              <meshStandardMaterial color="#ea4335" roughness={0.3} metalness={0.1} emissive="#441111" emissiveIntensity={0.2} />
            </mesh>
            {/* Envelope flap (triangle shape) */}
            <mesh position={[0, 0.55, 0.21]} rotation={[0, 0, 0]}>
              <coneGeometry args={[0.85, 0.45, 4]} />
              <meshStandardMaterial color="#fbbc04" roughness={0.4} />
            </mesh>
            {/* White letter line */}
            <mesh position={[0, 0.1, 0.23]}>
              <boxGeometry args={[1.3, 0.05, 0.02]} />
              <meshStandardMaterial color="#ffffff" emissive="#ffffff" emissiveIntensity={0.1} />
            </mesh>
            {/* Gmail style colors: blue strip */}
            <mesh position={[0.6, -0.3, 0.21]}>
              <boxGeometry args={[0.3, 0.15, 0.05]} />
              <meshStandardMaterial color="#4285f4" />
            </mesh>
            <mesh position={[-0.6, -0.3, 0.21]}>
              <boxGeometry args={[0.3, 0.15, 0.05]} />
              <meshStandardMaterial color="#34a853" />
            </mesh>
            {/* rotating ring around for flair */}
            <mesh rotation={[Math.PI / 2, 0, 0]} position={[0, -0.5, 0]}>
              <torusGeometry args={[1, 0.05, 32, 100]} />
              <meshStandardMaterial color="#9b4dff" emissive="#6a1b9a" emissiveIntensity={0.5} />
            </mesh>
          </group>
        );
      }
      
      return <primitive object={scene} scale={2} position={[0, -0.3, 0]} />;
    }
    
    // Main contact form component with exact color percentages
    function ContactForm() {
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });
      const [submitted, setSubmitted] = useState(false);
      
      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };
      
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email || !formData.message) {
          alert('Please fill all fields');
          return;
        }
        // simulate submission
        setSubmitted(true);
        setTimeout(() => setSubmitted(false), 3000);
        setFormData({ name: '', email: '', message: '' });
      };
      
      return (
        <div className="sixty-black w-full flex justify-center items-center p-4 md:p-8">
          {/* The main container background is 60% black (already set) */}
          <div className="w-full max-w-5xl flex flex-col lg:flex-row gap-8 items-center justify-center">
            
            {/* 3D Canvas Section - takes up visual balance but background merges with black, model stands out */}
            <div className="w-full lg:w-1/2 canvas-wrapper flex justify-center">
              <div className="w-full h-[380px] md:h-[450px] rounded-2xl overflow-hidden shadow-2xl" style={{ background: 'transparent' }}>
                <Canvas camera={{ position: [0, 0.5, 4.5], fov: 48 }} shadows>
                  <ambientLight intensity={1.2} />
                  <directionalLight position={[3, 5, 2]} intensity={1.8} castShadow />
                  <pointLight position={[-2, 3, 4]} intensity={0.8} color="#9b4dff" />
                  <Environment preset="night" background={false} />
                  <ModelWithFallback />
                  {/* Purple decorative ring orbit */}
                  <OrbitControls enableZoom={true} enablePan={false} autoRotate autoRotateSpeed={1.2} enableRotate />
                  <Html position={[0, -1.2, 0]} center distanceFactor={10}>
                    <div className="text-xs font-mono text-purple-300 bg-black/50 px-3 py-1 rounded-full backdrop-blur-sm">
                      📧 Gmail Legacy
                    </div>
                  </Html>
                </Canvas>
              </div>
            </div>
            
            {/* Contact Form Card: 30% white area (dominant white card) */}
            <div className="w-full lg:w-1/2 white-thirty-card p-6 md:p-8 rounded-2xl shadow-2xl border border-purple-500/30 transition-all duration-300 hover:shadow-purple-500/20">
              <div className="flex items-center gap-3 mb-5">
                <div className="w-10 h-10 rounded-full purple-bg flex items-center justify-center shadow-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <h2 className="text-2xl md:text-3xl font-bold tracking-tight bg-gradient-to-r from-gray-900 to-purple-800 bg-clip-text text-transparent">Contact Us</h2>
              </div>
              
              <p className="text-gray-600 mb-6 border-l-4 border-purple-500 pl-3 text-sm md:text-base">
                Have questions, feedback, or just want to say hello? Drop a message — we’d love to hear from you.
              </p>
              
              {submitted && (
                <div className="mb-5 p-3 bg-purple-50 text-purple-800 rounded-xl text-sm font-medium flex items-center gap-2 border border-purple-200">
                  <span>✅</span> Message sent successfully! We'll reply soon.
                </div>
              )}
              
              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1.5">Full name</label>
                  <input 
                    type="text" 
                    name="name"
                    value={formData.name}
                    onChange={handleChange}
                    className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition bg-white shadow-sm"
                    placeholder="John Doe"
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1.5">Email address</label>
                  <input 
                    type="email" 
                    name="email"
                    value={formData.email}
                    onChange={handleChange}
                    className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 transition bg-white"
                    placeholder="hello@example.com"
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1.5">Your message</label>
                  <textarea 
                    name="message"
                    rows="4"
                    value={formData.message}
                    onChange={handleChange}
                    className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none transition bg-white"
                    placeholder="How can we help you? ..."
                    required
                  ></textarea>
                </div>
                <button 
                  type="submit"
                  className="w-full purple-bg text-white font-bold py-3 rounded-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-md hover:shadow-purple-500/30 flex items-center justify-center gap-2 text-lg"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                  </svg>
                  Send Message
                </button>
              </form>
              
              <div className="mt-6 pt-4 text-center text-xs text-gray-400 border-t border-gray-100 flex justify-center gap-4">
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-purple-500"></span> 24/7 Support</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-purple-500"></span> Response within 24h</span>
              </div>
            </div>
          </div>
          
          {/* Extra purple decorative element: 10% purple expresses as floating accent line and glowing orb */}
          <div className="absolute bottom-8 left-8 w-28 h-28 rounded-full bg-purple-600/10 blur-3xl pointer-events-none"></div>
          <div className="absolute top-20 right-10 w-40 h-40 rounded-full bg-purple-500/5 blur-2xl pointer-events-none"></div>
        </div>
      );
    }
    
    // root render
    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<ContactForm />);
    
    // Additional: configure GLTF draco and ensure fallback path is well defined.
    // Since we use useGLTF, we can preload but not mandatory. Add a subtle style to body to ensure background pure black
    document.body.style.backgroundColor = '#0a0a0a';
    document.body.style.margin = '0';
    document.body.style.padding = '0';
  </script>
</body>
</html>
